name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile \
            api.py \
            modules/core.py \
            ingest.py \
            main.py \
            agent.py \
            monitor.py \
            reranker.py \
            pipeline.py \
            tests/test_api.py \
            tests/test_llm.py \
            scripts/debug_models.py \
            scripts/ingest_runner.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend syntax
        run: node --check static/app.js

